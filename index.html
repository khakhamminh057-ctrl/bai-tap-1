<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thông tin sản phẩm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <!-- Tiêu đề & Tag -->
        <div class="form-header">
            <h2>🎓 QUẢN LÝ THÔNG TIN SẢN PHẨM</h2>
            <div class="tags">
                <span class="tag active">HTML & CSS</span>
                <span class="tag">JavaScript</span>
                <span class="tag">Python</span>
                <span class="tag">AI/ML</span>
            </div>
        </div>

        <!-- Form nhập liệu -->
        <form action="#" method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label>Mã hàng <span class="required">*</span></label>
                    <input type="text" placeholder="Nhập mã hàng..." required>
                </div>
                <div class="form-group">
                    <label>Tên hàng <span class="required">*</span></label>
                    <input type="text" placeholder="Nhập tên sản phẩm..." required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Hãng sản xuất</label>
                    <input type="text" placeholder="Nhập hãng sản xuất...">
                    <small class="note">Định dạng: Chuỗi ký tự (ví dụ: Apple, Samsung)</small>
                </div>
                <div class="form-group">
                    <label>Xuất xứ</label>
                    <select>
                        <option value="vn">Việt Nam</option>
                        <option value="cn">Trung Quốc</option>
                        <option value="kr">Hàn Quốc</option>
                        <option value="us">Mỹ</option>
                        <option value="jp">Nhật Bản</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Mô tả chi tiết sản phẩm</label>
                <textarea rows="4" placeholder="Mô tả chi tiết đặc tính, thông số sản phẩm..."></textarea>
            </div>

            <!-- Trường thêm Link ảnh sản phẩm -->
            <div class="form-group">
                <label>Hình ảnh sản phẩm (Link Drive/URL)</label>
                <input type="url" placeholder="https://drive.google.com/file/d/...">
            </div>

            <!-- Giá sản phẩm -->
            <div class="price-box">
                Giá sản phẩm: <strong>2.500.000đ — 8.000.000đ (tùy dòng)</strong>
            </div>

            <!-- Các nút bấm -->
            <div class="form-actions">
                <button type="submit" class="btn btn-save">Lưu</button>
                <button type="reset" class="btn btn-cancel">Thoát</button>
            </div>
        </form>
    </div>

</body>
</html>
